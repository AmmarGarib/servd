# servd — consumer-side compose for running prebuilt Docker Hub images.
#
# This is the file Hasham (or anyone) uses to RUN servd without building.
# All 3 images live under ONE private Docker Hub repo with 3 tags
# (because Docker Hub free tier allows 1 free private repo):
#
#   ammargarib/servd:api          - the Fastify backend
#   ammargarib/servd:admin        - the Next.js operator UI
#   ammargarib/servd:storefront   - the Next.js public storefront
#
# Override DOCKER_REPO + TAG in your .env if those move.
#
# Setup on a fresh machine:
#   1. Install Docker Desktop
#   2. Copy .env.docker.template -> .env, fill in DB/Redis/secrets
#   3. docker login                           (paste Docker Hub creds)
#   4. docker compose pull                    (downloads the 3 image variants)
#   5. docker compose up -d                   (boots everything)
#   6. open http://localhost:3000 (admin), http://localhost:3002 (storefront)
#
# The maintainer (who BUILDS the images) uses infra/docker-compose.yml instead —
# that file has `build:` contexts. This one only has `image:` references.

services:
  api:
    image: ${DOCKER_REPO:-ammargarib/servd}:api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3001"
      ENABLE_WORKERS: "false"
    ports:
      - "3001:3001"

  admin:
    image: ${DOCKER_REPO:-ammargarib/servd}:admin
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      # Same as storefront: server-side fetches use the compose service alias,
      # client bundle uses the build-time-baked localhost URL.
      INTERNAL_API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

  storefront:
    image: ${DOCKER_REPO:-ammargarib/servd}:storefront
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      # Server-side fetches from inside the container reach the api service
      # via Docker's network alias, NOT localhost (which would be the
      # storefront's own container). The client bundle has the URL baked at
      # build time as http://localhost:3001, so browser-side fetches still
      # use the host's port mapping.
      INTERNAL_API_URL: http://api:3001
    ports:
      - "3002:3000"
    depends_on:
      - api
