name: Build and push to Docker Hub

# Builds the three servd images and pushes them to Docker Hub on every
# merge to main. After the push, hits the deploy webhook on the prod
# Windows box so it pulls the new images and restarts the containers.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   — Docker Hub username (e.g. ammargarib)
#   DOCKERHUB_TOKEN      — Docker Hub personal access token (NOT the password)
#                          Generate at https://app.docker.com/settings/personal-access-tokens
#   DEPLOY_WEBHOOK_URL   — full URL including ?secret=... query string
#   PUBLIC_API_URL       — public api hostname baked into the storefront/admin
#                          client bundles, e.g. https://servd-api.garibsons.app
#   PUBLIC_WS_URL        — public websocket URL, e.g. wss://servd-api.garibsons.app
#
# Optional:
#   SENTRY_DSN_STOREFRONT
#   SENTRY_DSN_ADMIN

on:
  push:
    branches: [main]
    # Only run when something that actually changes an image's contents
    # is touched. Cuts CI minutes by skipping docs-only or workflow-only PRs.
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packages/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:  # allow manual triggers from the Actions tab

jobs:
  build-storefront:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push storefront
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/storefront
          file: ./frontend/storefront/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/servd:storefront
            ${{ secrets.DOCKERHUB_USERNAME }}/servd:storefront-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.PUBLIC_WS_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN_STOREFRONT }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/servd:storefront
          cache-to: type=inline

  build-admin:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push admin
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/admin
          file: ./frontend/admin/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/servd:admin
            ${{ secrets.DOCKERHUB_USERNAME }}/servd:admin-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.PUBLIC_WS_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN_ADMIN }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/servd:admin
          cache-to: type=inline

  build-api:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push api
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/servd:api
            ${{ secrets.DOCKERHUB_USERNAME }}/servd:api-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/servd:api
          cache-to: type=inline

  trigger-deploy:
    # Fires after all three images have been pushed. Hits the prod webhook
    # which (per webhook-server.js) does `docker compose pull && up -d` on
    # the Windows box. If DEPLOY_WEBHOOK_URL isn't set, the step is a no-op.
    needs: [build-storefront, build-admin, build-api]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        if: ${{ env.DEPLOY_URL != '' }}
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering deploy webhook…"
          curl -sS -X POST "$DEPLOY_URL" -w '\nHTTP %{http_code}\n' || echo "Webhook returned non-zero — check the box."
