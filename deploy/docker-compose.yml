version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Servd — Windows Docker + Cloudflare Tunnel production stack
#
# Database : Neon (cloud Postgres)   — URL comes from .env.production
# Cache    : Upstash Redis           — URL comes from .env.production
# Routing  : Cloudflare Tunnel       — no ports exposed on host
#
# Tunnel routes to set in Cloudflare Zero Trust dashboard:
#   api.servd.garibsons.app    → http://api:3001
#   admin.servd.garibsons.app  → http://admin:3000
#   app.servd.garibsons.app    → http://storefront:3000
#   deploy.servd.garibsons.app → http://host.docker.internal:9000  (webhook)
#
# Files needed before running:
#   deploy/.env              (auto-created by deploy.bat)
#   deploy/.env.production   (auto-copied from root .env by deploy.bat)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─────────── Backend API (Fastify + Prisma) ───────────────────────────────
  api:
    # Prebuilt image from Docker Hub — production does NOT build from source
    # on the box (see CLAUDE.md). Pinned to an immutable SHA tag so `up`
    # always pulls the intended build instead of reusing a stale local layer.
    image: ammargarib/servd:api-d61b3f0
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: "production"
      PORT: "3001"
      ENABLE_WORKERS: "true"
      API_URL: "https://api.servd.garibsons.app"
      WEB_URL: "https://admin.servd.garibsons.app"
      STOREFRONT_URL: "https://servd.pk"
      # Row-level security enforcement. When "1", the Prisma extension at
      # src/lib/prisma.ts injects SET LOCAL app.tenant_ids / app.customer_id
      # on every request-scoped query, and the policies created by the
      # 20260603071500_enable_rls_phase2 + 20260603073000_enable_rls_phase3
      # migrations gate row visibility. Workers + webhook handlers use the
      # `serviceClient` (no extension) which leaves session vars unset, so
      # policies short-circuit on app_is_service_mode() and let them through.
      RLS_ENFORCE: "1"
    # Let the image's ENTRYPOINT handle startup. It runs:
    #   1. prisma migrate resolve --applied 0_init (idempotent baseline)
    #   2. prisma migrate deploy — FATAL. A non-zero exit stops the boot.
    #   3. node dist/src/index.js
    #
    # This comment used to say migrate-deploy was best-effort and "logs and
    # continues". It does not: entrypoint.sh exits 1 on failure, deliberately,
    # because booting against a stale schema serves wrong data — including
    # financial totals — mid-service, which is worse than a visibly failed
    # deploy someone can roll back. Only the `migrate resolve` baseline step
    # above it is best-effort. Worth being exact about: whether a failed
    # migration still boots is the difference between "the deploy broke" and
    # "the books are quietly wrong".
    # No `command:` override here on purpose.
    networks:
      - servd_net

  # ─────────── Admin Panel (Next.js) ────────────────────────────────────────
  admin:
    # Prebuilt image from Docker Hub. NEXT_PUBLIC_* values are baked at image
    # build time (CI / out-of-band build), not here.
    image: ammargarib/servd:admin-d61b3f0
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      # Server-side fetches reach the api container via the docker network,
      # avoiding a Cloudflare Tunnel hairpin through the public hostname.
      INTERNAL_API_URL: "http://api:3001"
    depends_on:
      - api
    networks:
      - servd_net

  # ─────────── Customer Storefront (Next.js) ────────────────────────────────
  storefront:
    # Prebuilt image from Docker Hub. NEXT_PUBLIC_* values are baked at image
    # build time (CI / out-of-band build), not here.
    image: ammargarib/servd:storefront-d61b3f0
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      INTERNAL_API_URL: "http://api:3001"
    # Wipe Next.js's persistent fetch/data cache on every container start.
    # Without this, an empty response cached during the first post-deploy
    # request (api still warming up) sticks around indefinitely, so
    # /brand/<slug> 404s while /browse (force-dynamic, uncached) works.
    # Adding `command` here also forces docker compose to recreate the
    # container even when the image is unchanged.
    command: >
      sh -c "rm -rf /app/.next/cache /app/.next/standalone/.next/cache 2>/dev/null; node server.js"
    depends_on:
      - api
    networks:
      - servd_net

  # ─────────── Cloudflare Tunnel ────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token "${CF_TUNNEL_TOKEN}"
    depends_on:
      - api
      - admin
      - storefront
    networks:
      - servd_net

networks:
  servd_net:
    driver: bridge
