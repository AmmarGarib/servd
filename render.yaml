# Render.com Blueprint — declarative service config.
#
# When you create a Blueprint service in the Render dashboard pointing at
# this repo, Render reads this file and provisions the listed services.
#
# Free tier specs (per service):
#   - 512 MB RAM, 0.1 CPU
#   - Sleeps after 15 minutes of inactivity (~30s cold start on wake)
#   - Auto HTTPS at <name>.onrender.com
#   - Auto-redeploy on every push to `main`
#
# Secret env vars (DATABASE_URL, JWT_SECRET, REDIS_URL, etc) are NOT defined
# here — set them in the Render dashboard so they don't end up in git.

services:
  - type: web
    name: servd-api
    runtime: node
    plan: free
    region: singapore   # closest to Neon Postgres ap-southeast-1
    rootDir: backend
    branch: main
    autoDeploy: true

    # Build phase — runs on Render's CI runners (NOT the tiny free instance),
    # so heavy steps like prisma generate + tsc are fine even on the free plan.
    buildCommand: npm install && npx prisma generate && npm run build

    # Start phase — runs on the actual web instance.
    # Render auto-injects PORT, our backend reads process.env.PORT.
    startCommand: npm start

    # Probed by Render to know if the service is alive. Hitting `/` returns
    # 404 on the Fastify app (no root route), which Render still treats as
    # "alive" — anything <500 counts as healthy.
    healthCheckPath: /

    envVars:
      - key: NODE_ENV
        value: production
      # Disable bullmq workers until REDIS_URL is set in dashboard. Once Redis
      # is wired up, flip this to true via dashboard env var override.
      - key: ENABLE_WORKERS
        value: false
      - key: INBOUND_EMAIL_DOMAIN
        value: inbox.servd.app
      # The remaining env vars (DATABASE_URL, JWT_SECRET, REDIS_URL, SMTP_*,
      # WHATSAPP_*, POSTMARK_INBOUND_SECRET) are set in dashboard.
